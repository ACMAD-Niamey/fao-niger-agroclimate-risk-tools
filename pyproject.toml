[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fao-niger-agroclimate-risk-tools"
version = "0.1.0"
description = "Agroclimatic risk mapping tools for FAO Niger."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
